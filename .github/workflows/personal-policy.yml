name: Personal policy

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python: python3
          - os: windows-latest
            python: python
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: tj-agents/personal
          ref: ${{ github.repository == 'tj-agents/personal' && github.sha || 'main' }}
          path: .personal
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check selection, mandatory native instructions and retired aliases
        run: ${{ matrix.python }} -B .personal/.agents/personal/utility/use/scripts/use.py --root . --mode check
