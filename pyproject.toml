[project]
name = "personal-agent-development"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[dependency-groups]
dev = ["pytest>=9.1.1"]

[tool.pytest]
strict = true
testpaths = [".agents/tests"]
addopts = ["--import-mode=importlib", "-ra"]
filterwarnings = ["error"]
