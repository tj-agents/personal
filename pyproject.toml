[project]
name = "personal-agent-development"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[dependency-groups]
dev = ["mypy>=2.4.1", "pytest>=9.1.1", "ruff>=0.17.4", "pytest-socket>=0.7.0"]

[tool.ruff]
extend-exclude = [".agents/sync_generated.py", ".agents/dependencies", ".codex/skills", ".claude/skills", ".codex/hooks/snapshot.py", ".codex/hooks/bootstrap.py", ".worktrees", ".template", "plugins"]
include = ["*.py", "*.pyi"]
target-version = "py312"

[tool.ruff.lint]
explicit-preview-rules = true
preview = true
select = ["E", "W", "F", "I", "N", "UP", "B", "A", "BLE", "C4", "SIM", "PTH", "PIE", "RET", "RUF", "PGH004", "ANN401", "G004", "PLW1514", "LOG002", "LOG015", "PLC2701", "ICN001", "TID251", "TRY300", "PT009", "PT011", "PT006", "PLR6301"]

[tool.mypy]
explicit_package_bases = true
exclude = ["(^|/)(?:\\.agents/sync_generated\\.py|\\.agents/dependencies/|\\.codex/skills/|\\.claude/skills/|\\.codex/hooks/(?:snapshot|bootstrap)\\.py|\\.worktrees/|\\.template/)", "^plugins/"]
enable_error_code = ["ignore-without-code", "exhaustive-match"]
strict = true
warn_unreachable = true
files = [".agents"]

[tool.pytest]
strict = true
testpaths = [".agents/tests"]
addopts = ["--import-mode=importlib", "-ra", "--disable-socket"]
filterwarnings = ["error"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"unittest.TestCase" = { "msg" = "Use plain pytest functions and bare assertions." }
"importlib.util.spec_from_file_location" = { "msg" = "Import the installed public API; do not load another checkout by path." }
"sys.path" = { "msg" = "Install the declared dependency; do not modify the import search path." }

[tool.ruff.lint.flake8-pytest-style]
raises-require-match-for = ["*"]

[tool.ruff.lint.per-file-ignores]
".agents/tests/test_use.py" = ["E501", "I001", "PT009", "TID251"]
".agents/tests/test_bot_identity.py" = ["B905", "E501", "I001", "PLR6301", "PT009", "SIM117", "TID251"]
".agents/tests/test_approve.py" = ["E501", "PLR6301", "PT009", "PTH123", "TID251"]
".agents/personal/utility/use/scripts/use.py" = ["E501", "I001", "RET504", "TID251"]
".agents/personal/utility/bot-identity/scripts/bot_identity.py" = ["A002", "E501", "I001", "N801", "PLR6301", "PTH100", "PTH105", "RET507", "TRY300", "UP012"]
".agents/personal/utility/approve/scripts/approve.py" = ["E501", "TID251"]
".agents/personal/policy/rules/scripts/personal_scope.py" = ["E501", "I001"]
".agents/tests/test_personal_use.py" = ["PLR6301", "PT009", "TID251"]
".agents/tests/test_personal_shims.py" = ["TID251"]
".agents/tests/test_personal_packaging.py" = ["PT009", "TID251"]

[[tool.python-standards.exceptions]]
path = ".agents/personal/utility/approve/scripts/approve.py"
rule = "PY016"
reason = "Legacy host integration reads process state while resolving native configuration."

[[tool.python-standards.exceptions]]
path = ".agents/personal/utility/bot-identity/scripts/bot_identity.py"
rule = "PY001"
reason = "Existing host integration traversal flattens nested records."

[[tool.python-standards.exceptions]]
path = ".agents/personal/utility/bot-identity/scripts/bot_identity.py"
rule = "PY016"
reason = "Legacy host integration reads process state while resolving native configuration."

[[tool.python-standards.exceptions]]
path = ".agents/tests/test_approve.py"
rule = "PY016"
reason = "Existing test reads or replaces process state at a command boundary."

[[tool.python-standards.exceptions]]
path = ".agents/tests/test_bot_identity.py"
rule = "PY016"
reason = "Existing test reads or replaces process state at a command boundary."

[tool.ruff.format]
exclude = [".agents/personal/policy/rules/scripts/personal_scope.py", ".agents/personal/utility/approve/scripts/approve.py", ".agents/personal/utility/bot-identity/scripts/bot_identity.py", ".agents/personal/utility/use/scripts/use.py", ".agents/tests/test_approve.py", ".agents/tests/test_bot_identity.py", ".agents/tests/test_use.py"]

[[tool.mypy.overrides]]
module = "approve"
disable_error_code = ["arg-type", "attr-defined", "index", "no-any-return", "no-untyped-def", "type-arg"]

[[tool.mypy.overrides]]
module = "bot_identity"
disable_error_code = ["arg-type", "attr-defined", "no-any-return", "no-untyped-def", "type-arg", "union-attr"]

[[tool.mypy.overrides]]
module = "personal_scope"
disable_error_code = ["no-untyped-def"]

[[tool.mypy.overrides]]
module = "test_approve"
disable_error_code = ["arg-type", "assignment", "no-untyped-call", "no-untyped-def", "union-attr", "var-annotated"]

[[tool.mypy.overrides]]
module = "test_bot_identity"
disable_error_code = ["arg-type", "attr-defined", "no-untyped-call", "no-untyped-def", "union-attr"]

[[tool.mypy.overrides]]
module = "test_personal_use"
disable_error_code = ["arg-type", "no-any-return", "no-untyped-def", "union-attr"]

[[tool.mypy.overrides]]
module = "test_use"
disable_error_code = ["arg-type", "no-untyped-call", "no-untyped-def", "union-attr"]

[[tool.mypy.overrides]]
module = "use"
disable_error_code = ["no-untyped-call"]
